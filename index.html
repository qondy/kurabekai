<!DOCTYPE html>
<html lang="ja">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-J41Z0NHW20"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-J41Z0NHW20', { 'app_name': 'kurabekai' });
  </script>

  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>くらべ会</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <meta property="og:title" content="くらべ会">
  <meta property="og:description" content="飲み比べ・食べ比べをして自分だけの一番を決める、比べ会の記録アプリ。">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://kurabekai.vercel.app/ogp.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://kurabekai.vercel.app/ogp.png">
</head>
<body>

  <!-- ログイン画面 -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <span class="login-card__logo">🏆</span>
      <h1 class="login-card__title">くらべ会</h1>
      <p class="login-card__tagline">飲み比べ・食べ比べをして、<br>自分だけの「一番」を決めましょう。</p>
      <button id="btn-google-login" class="google-btn">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Googleでログイン
      </button>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="app-header">
      <span class="app-header__brand">🏆 くらべ会</span>
      <nav class="app-header__nav">
        <a href="about.html" class="app-header__about-link">アプリについて</a>
        <div id="user-info" class="app-header__user hidden">
          <img id="user-avatar" class="app-header__avatar" src="" alt="" />
          <span id="user-name" class="app-header__name"></span>
          <button id="btn-logout" class="btn btn--ghost btn--sm">ログアウト</button>
        </div>
      </nav>
    </header>

    <nav class="tab-nav" id="tab-nav">
      <button type="button" class="tab-btn is-active" data-view="list">📋 比べ会</button>
      <button type="button" class="tab-btn" data-view="champions">🏆 殿堂入り</button>
    </nav>

    <main class="app-main">

      <!-- 一覧 -->
      <section id="list-view" class="view">
        <div class="section__head">
          <h2 class="section__title">比べ会</h2>
          <button type="button" id="btn-new" class="btn btn--primary btn--sm">＋ 新しい比べ会</button>
        </div>
        <div id="session-list" class="session-list"></div>
        <div id="list-empty" class="empty-state hidden">
          <div class="empty-state__icon">🥂</div>
          <p>まだ比べ会がありません。<br>「＋ 新しい比べ会」から始めましょう。</p>
        </div>
      </section>

      <!-- 新規作成 -->
      <section id="create-view" class="view hidden">
        <div class="detail-bar">
          <button type="button" id="btn-create-back" class="btn btn--ghost btn--sm">← 戻る</button>
        </div>
        <h2 class="section__title" style="margin-bottom:16px;">新しい比べ会</h2>
        <form id="create-form" class="card">
          <div class="form-field">
            <label class="form-field__label" for="c-title">タイトル</label>
            <input id="c-title" class="form-field__input" placeholder="例）コンビニの緑茶 飲み比べ" required />
          </div>
          <div class="form-field">
            <label class="form-field__label" for="c-memo">ひとことメモ（任意）</label>
            <textarea id="c-memo" class="form-field__textarea" placeholder="開催のきっかけ、ルールなど"></textarea>
          </div>

          <div class="form-field">
            <span class="form-field__label">形式</span>
            <div class="choice-group">
              <label class="choice">
                <input type="radio" name="c-mode" value="score" checked />
                <span class="choice__title">点数で採点</span>
                <span class="choice__desc">軸ごとに点をつけて合計で決める</span>
              </label>
              <label class="choice">
                <input type="radio" name="c-mode" value="tournament" />
                <span class="choice__title">トーナメント</span>
                <span class="choice__desc">1対1の対戦を勝ち抜き式で</span>
              </label>
            </div>
          </div>

          <label class="check-line">
            <input type="checkbox" id="c-blind" />
            <span>ブラインドにする</span>
            <span class="check-line__hint">A・B・C… で伏せて採点し、あとで正体を公開</span>
          </label>

          <div class="form-field" id="c-axes-field">
            <label class="form-field__label">評価軸</label>
            <div id="c-axes" class="chip-editor"></div>
            <datalist id="axis-suggestions">
              <option value="味"></option>
              <option value="香り"></option>
              <option value="コスパ"></option>
              <option value="見た目"></option>
              <option value="のどごし"></option>
              <option value="余韻"></option>
              <option value="甘み"></option>
              <option value="酸味"></option>
              <option value="苦み"></option>
              <option value="食感"></option>
              <option value="ボリューム"></option>
            </datalist>
          </div>

          <div class="form-field">
            <label class="form-field__label">エントリー</label>
            <div id="c-entries" class="entry-rows"></div>
            <button type="button" id="btn-add-entry" class="btn btn--ghost btn--sm">＋ エントリーを追加</button>
          </div>

          <div class="modal__actions">
            <button type="button" id="btn-create-cancel" class="btn btn--ghost">キャンセル</button>
            <button type="submit" id="btn-create-submit" class="btn btn--primary">比べ会をはじめる</button>
          </div>
        </form>
      </section>

      <!-- 詳細 -->
      <section id="detail-view" class="view hidden">
        <div class="detail-bar">
          <button type="button" id="btn-detail-back" class="btn btn--ghost btn--sm">← 一覧へ</button>
        </div>
        <div id="detail-body"></div>
      </section>

      <!-- 殿堂入り -->
      <section id="champions-view" class="view hidden">
        <div class="section__head">
          <h2 class="section__title">殿堂入り</h2>
        </div>
        <p class="view-intro">結果を確定した比べ会の優勝者が並びます。</p>
        <div id="champion-list" class="champion-list"></div>
        <div id="champions-empty" class="empty-state hidden">
          <div class="empty-state__icon">🏆</div>
          <p>まだ殿堂入りはありません。<br>比べ会の結果を確定すると、ここに載ります。</p>
        </div>
      </section>

    </main>

    <footer class="footer">
      <p>© 2026 Yuji Nakamura. All rights reserved.</p>
      <p><a href="https://apps.yuji-nakamura.com/" target="_blank" rel="noopener">他のアプリを見る →</a></p>
    </footer>

    <button id="feedback-btn" class="feedback-btn">💬 ご意見・ご要望</button>
  </div>

  <!-- 確認ダイアログ（カスタムUI） -->
  <div id="confirm-dialog-overlay" class="dialog-overlay">
    <div class="dialog">
      <div id="confirm-dialog-title" class="dialog__title">確認</div>
      <div id="confirm-dialog-text" class="dialog__text"></div>
      <div class="dialog__actions">
        <button id="btn-confirm-cancel" class="btn btn--ghost">キャンセル</button>
        <button id="btn-confirm-ok" class="btn btn--danger">実行する</button>
      </div>
    </div>
  </div>

  <!-- 設定モーダル -->
  <div id="settings-modal-overlay" class="dialog-overlay">
    <div class="modal">
      <div class="modal__head">
        <div class="modal__title">比べ会の設定</div>
        <button id="btn-settings-close" class="modal__close" aria-label="閉じる">&times;</button>
      </div>
      <label class="form-field__label" for="s-title">タイトル</label>
      <input id="s-title" type="text" />
      <label class="form-field__label" for="s-memo">ひとことメモ</label>
      <textarea id="s-memo" rows="3"></textarea>
      <div class="modal__actions">
        <button id="btn-settings-delete" class="btn btn--danger">この比べ会を削除</button>
        <button id="btn-settings-save" class="btn btn--primary">保存する</button>
      </div>
    </div>
  </div>

  <!-- 要望送信モーダル -->
  <div id="feedback-modal-overlay" class="dialog-overlay">
    <div class="modal">
      <div class="modal__head">
        <div class="modal__title">ご意見・ご要望</div>
        <button id="btn-feedback-close" class="modal__close" aria-label="閉じる">&times;</button>
      </div>
      <textarea id="input-feedback-message" rows="5" placeholder="ご意見・ご要望・バグ報告など、なんでもどうぞ"></textarea>
      <div class="modal__actions">
        <button id="btn-feedback-send" class="btn btn--primary">送信する</button>
      </div>
      <p class="modal__note">送信内容は開発者に届きます。個人情報は入力しないでください。</p>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/main.js"></script>
</body>
</html>
